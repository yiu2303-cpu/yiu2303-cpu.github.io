<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1d4ed8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>九龍灣 → 航天城 · 巴士到站時間</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        body {
            padding-bottom: calc(var(--safe-bottom) + 1rem);
        }
        .shell {
            width: min(72rem, calc(100% - 1.5rem));
            margin-inline: auto;
        }
        @media (min-width: 640px) {
            .shell { width: min(72rem, calc(100% - 3rem)); }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body class="min-h-dvh bg-slate-100 text-slate-800 antialiased">
    <header class="sticky top-0 z-20 w-full border-b border-blue-700/20 bg-blue-600 text-white" style="padding-top: var(--safe-top);">
        <div class="shell flex items-center gap-2 py-3 sm:gap-3 sm:py-4">
            <div class="min-w-0 flex-1">
                <p class="text-[11px] font-semibold uppercase tracking-[0.14em] text-blue-100" data-i18n="kicker">城巴實時到站</p>
                <h1 class="mt-0.5 font-bold leading-snug">
                    <span class="block text-base sm:hidden" data-i18n="titleShort">九龍灣 → 航天城</span>
                    <span class="hidden text-xl sm:inline lg:text-2xl" data-i18n="titleLong">九龍灣站 → 航天城</span>
                </h1>
            </div>
            <div class="flex shrink-0 items-center gap-2">
                <span id="live-status" class="hidden rounded-full bg-white/15 px-2.5 py-1 text-[11px] font-semibold text-emerald-100 sm:inline"></span>
                <div class="flex overflow-hidden rounded-full bg-white/15 p-0.5 text-[11px] font-bold" role="group" aria-label="Language">
                    <button type="button" id="lang-zh" class="rounded-full px-2.5 py-1.5 min-h-11 sm:min-h-0" data-lang="zh-HK">繁</button>
                    <button type="button" id="lang-en" class="rounded-full px-2.5 py-1.5 min-h-11 sm:min-h-0" data-lang="en">EN</button>
                </div>
                <button
                    id="refresh-btn"
                    type="button"
                    class="inline-flex h-11 w-11 items-center justify-center rounded-full bg-white text-blue-700 shadow-sm active:scale-95 disabled:opacity-60 sm:h-12 sm:w-12"
                    data-i18n-aria="refreshAria"
                    aria-label="重新整理"
                >
                    <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                </button>
            </div>
        </div>
        <p id="update-time" class="shell pb-3 text-[11px] text-blue-100 sm:text-xs"></p>
    </header>

    <main class="shell py-3 sm:py-6 lg:py-8">
        <div class="grid grid-cols-1 gap-3 lg:grid-cols-5 lg:gap-4">
            <section class="overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-slate-200/80 lg:col-span-3">
                <div class="grid grid-cols-[auto_1fr] gap-x-3 px-4 py-3 sm:hidden">
                    <div class="flex flex-col items-center pt-1">
                        <span class="h-2.5 w-2.5 rounded-full bg-blue-600"></span>
                        <span class="my-1 w-px flex-1 bg-slate-200"></span>
                        <span class="h-2.5 w-2.5 rounded-full bg-sky-400"></span>
                    </div>
                    <div class="space-y-3">
                        <div>
                            <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-400" data-i18n="board">上車</p>
                            <p class="text-sm font-semibold text-slate-900" data-i18n="boardStop">九龍灣站</p>
                            <p class="text-xs text-slate-500" data-i18n="boardHint">觀塘道 · 往機場／航天城方向</p>
                        </div>
                        <div>
                            <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-400" data-i18n="alight">下車</p>
                            <p class="text-sm font-semibold text-slate-900" data-i18n="alightStop">航天城</p>
                            <p class="text-xs text-slate-500" data-i18n="alightHint">觀景路</p>
                        </div>
                    </div>
                </div>
                <div class="hidden sm:grid sm:grid-cols-[1fr_auto_1fr] sm:items-center">
                    <div class="px-5 py-4">
                        <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-400" data-i18n="board">上車</p>
                        <p class="text-base font-semibold text-slate-900" data-i18n="boardStop">九龍灣站</p>
                        <p class="text-xs text-slate-500" data-i18n="boardHint">觀塘道 · 往機場／航天城方向</p>
                    </div>
                    <div class="px-2 text-2xl font-light text-slate-300" aria-hidden="true">→</div>
                    <div class="px-5 py-4">
                        <p class="text-[11px] font-semibold uppercase tracking-wide text-slate-400" data-i18n="alight">下車</p>
                        <p class="text-base font-semibold text-slate-900" data-i18n="alightStop">航天城</p>
                        <p class="text-xs text-slate-500" data-i18n="alightHint">觀景路</p>
                    </div>
                </div>
            </section>

            <div class="grid grid-cols-3 gap-2 lg:col-span-2 lg:gap-3" data-i18n-aria="routesAria" aria-label="途經此行程的路線">
                <div class="rounded-2xl bg-white px-2 py-2.5 text-center shadow-sm ring-1 ring-slate-200/80 sm:px-3 sm:py-4">
                    <p class="text-[10px] font-semibold uppercase tracking-wide text-slate-400 sm:text-xs" data-i18n="allDay">全日</p>
                    <p class="text-lg font-bold text-slate-900 sm:text-2xl">E22</p>
                </div>
                <div class="rounded-2xl bg-white px-2 py-2.5 text-center shadow-sm ring-1 ring-slate-200/80 sm:px-3 sm:py-4">
                    <p class="text-[10px] font-semibold uppercase tracking-wide text-slate-400 sm:text-xs" data-i18n="peak">繁忙時間</p>
                    <p class="text-lg font-bold text-slate-900 sm:text-2xl">E22X</p>
                </div>
                <div class="rounded-2xl bg-white px-2 py-2.5 text-center shadow-sm ring-1 ring-slate-200/80 sm:px-3 sm:py-4">
                    <p class="text-[10px] font-semibold uppercase tracking-wide text-slate-400 sm:text-xs" data-i18n="cityflyer">機場快線</p>
                    <p class="text-lg font-bold text-slate-900 sm:text-2xl">A22</p>
                </div>
            </div>
        </div>
        <p id="mobile-status" class="mt-2 text-xs font-medium text-emerald-700 sm:hidden"></p>

        <div id="eta-container" class="mt-3 grid grid-cols-1 gap-3 sm:mt-4 md:grid-cols-2 lg:grid-cols-3 lg:gap-4" aria-live="polite">
            <div class="col-span-full animate-pulse rounded-2xl bg-white p-6 text-center text-sm text-slate-400 shadow-sm" data-i18n="loading">正在載入到站時間…</div>
        </div>

        <details class="mt-4 rounded-2xl bg-white p-4 text-sm text-slate-600 shadow-sm ring-1 ring-slate-200/80 sm:p-5">
            <summary class="min-h-11 cursor-pointer list-none font-semibold text-slate-800" data-i18n="corridorTitle">本走廊路線說明</summary>
            <ul class="mt-3 list-disc space-y-2 pl-5 text-slate-600">
                <li data-i18n="noteE22"></li>
                <li data-i18n="noteE22X"></li>
                <li data-i18n="noteA22"></li>
                <li data-i18n="noteSkip"></li>
            </ul>
        </details>

        <footer class="mt-5 px-1 pb-4 text-center text-[11px] leading-relaxed text-slate-400">
            <span data-i18n="footerBefore">資料來源：</span>
            <a href="https://data.gov.hk" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline">DATA.GOV.HK</a>
            <span data-i18n="footerAfter">城巴開放數據。到站時間僅供參考。</span>
        </footer>
    </main>

    <script>
        (function () {
            const API_BASE = "https://rt.data.gov.hk/v2/transport/citybus";
            const COMPANY = "CTB";
            const BOARD_STOP_ID = "001500";
            const REFRESH_MS = 30000;
            const LANG_KEY = "bus-eta-lang";
            const ROUTES = ["E22", "E22X", "A22"];

            const I18N = {
                "zh-HK": {
                    htmlLang: "zh-HK",
                    documentTitle: "九龍灣 → 航天城 · 巴士到站時間",
                    kicker: "城巴實時到站",
                    titleShort: "九龍灣 → 航天城",
                    titleLong: "九龍灣站 → 航天城",
                    board: "上車",
                    boardStop: "九龍灣站",
                    boardHint: "觀塘道 · 往機場／航天城方向",
                    alight: "下車",
                    alightStop: "航天城",
                    alightHint: "觀景路",
                    allDay: "全日",
                    peak: "繁忙時間",
                    cityflyer: "機場快線",
                    routesAria: "途經此行程的路線",
                    refreshAria: "重新整理",
                    loading: "正在載入到站時間…",
                    updating: "更新中…",
                    live: "實時",
                    buses: "班次",
                    noDue: "暫無班次",
                    apiDown: "未能連接資料",
                    failed: "載入失敗",
                    updated: "已更新",
                    stopHint: "觀塘道車站",
                    lastAttempt: "上次嘗試",
                    fetchFail: "未能連接城巴開放數據，請檢查網絡後再重新整理。",
                    empty: "現時沒有即將到站的班次。E22X 只於平日繁忙時間行走，屬正常情況。",
                    next: "下一班",
                    following: "其後",
                    due: "即將到站",
                    now: "現在",
                    min: "分鐘",
                    destPrefix: "往",
                    corridorTitle: "本走廊路線說明",
                    noteE22: "E22 — 藍田（北）往航天城。途經九龍灣站及航天城，全日服務。",
                    noteE22X: "E22X — 油塘往航天城。同樣途經上述兩站，只於平日繁忙時間服務。",
                    noteA22: "A22 — 藍田站往機場。官方站位包括航天城；城巴註明部分早上班次繞經航天城，其他班次或直達客運大樓。",
                    noteSkip: "未列出：A29／NA29 停九龍灣站但不經航天城（往一號客運大樓）。E22A／E22C／E22P 停航天城但不經九龍灣站（E22P 最近為坪石邨）。",
                    footerBefore: "資料來源：",
                    footerAfter: "城巴開放數據。到站時間僅供參考。",
                    langGroup: "語言"
                },
                en: {
                    htmlLang: "en",
                    documentTitle: "Kowloon Bay → Cathay Pacific City · Bus ETA",
                    kicker: "Citybus live ETA",
                    titleShort: "Kowloon Bay → Cathay City",
                    titleLong: "Kowloon Bay Station → Cathay Pacific City",
                    board: "Board",
                    boardStop: "Kowloon Bay Station",
                    boardHint: "Kwun Tong Road · towards Airport / SKYCITY",
                    alight: "Alight",
                    alightStop: "Cathay Pacific City",
                    alightHint: "Scenic Road",
                    allDay: "All day",
                    peak: "Peak",
                    cityflyer: "Cityflyer",
                    routesAria: "Routes that serve this journey",
                    refreshAria: "Refresh bus arrivals",
                    loading: "Fetching upcoming arrivals…",
                    updating: "Updating…",
                    live: "Live",
                    buses: "buses",
                    noDue: "No buses due",
                    apiDown: "API unavailable",
                    failed: "Failed",
                    updated: "Updated",
                    stopHint: "Kwun Tong Road stop",
                    lastAttempt: "Last attempt",
                    fetchFail: "Could not reach the Citybus API. Check your network and tap refresh.",
                    empty: "No upcoming arrivals. E22X only runs at weekday peak hours.",
                    next: "Next bus",
                    following: "Following",
                    due: "Due",
                    now: "now",
                    min: "min",
                    destPrefix: "To",
                    corridorTitle: "Routes on this corridor",
                    noteE22: "E22 — Lam Tin (North) → SKYCITY. Stops at Kowloon Bay Station then Cathay Pacific City. Main all-day service.",
                    noteE22X: "E22X — Yau Tong → SKYCITY. Same two stops. Weekday peak only; empty ETA is normal outside service hours.",
                    noteA22: "A22 — Lam Tin Station → Airport. Official stop list includes Cathay Pacific City. Citybus notes some morning trips divert via Cathay City; others may go to the passenger terminal only.",
                    noteSkip: "Not shown: A29 / NA29 stop at Kowloon Bay Station but skip Cathay Pacific City (Airport Terminal 1). E22A / E22C / E22P serve Cathay Pacific City but skip Kowloon Bay Station (E22P nearest is Ping Shek Estate).",
                    footerBefore: "Data from ",
                    footerAfter: " Citybus Open API. Times are estimates only.",
                    langGroup: "Language"
                }
            };

            const container = document.getElementById("eta-container");
            const timeSpan = document.getElementById("update-time");
            const liveStatus = document.getElementById("live-status");
            const mobileStatus = document.getElementById("mobile-status");
            const refreshBtn = document.getElementById("refresh-btn");
            const refreshIcon = document.getElementById("refresh-icon");
            const langZh = document.getElementById("lang-zh");
            const langEn = document.getElementById("lang-en");

            let inflight = null;
            let lastResults = null;
            let lastUpdatedAt = null;
            let lang = "zh-HK";

            function t(key) {
                const pack = I18N[lang] || I18N["zh-HK"];
                return pack[key] || key;
            }

            function detectLang() {
                try {
                    const saved = localStorage.getItem(LANG_KEY);
                    if (saved === "en" || saved === "zh-HK") return saved;
                } catch (e) { /* ignore quota / private mode */ }
                return "zh-HK";
            }

            function applyLang() {
                const pack = I18N[lang];
                document.documentElement.lang = pack.htmlLang;
                document.title = pack.documentTitle;
                document.querySelectorAll("[data-i18n]").forEach(function (el) {
                    el.textContent = t(el.getAttribute("data-i18n"));
                });
                document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
                    el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
                });
                langZh.className = toggleClass(lang === "zh-HK");
                langEn.className = toggleClass(lang === "en");
                langZh.setAttribute("aria-pressed", lang === "zh-HK" ? "true" : "false");
                langEn.setAttribute("aria-pressed", lang === "en" ? "true" : "false");
                writeUpdatedTime(lastUpdatedAt);
                if (lastResults) renderResults(lastResults);
            }

            function writeUpdatedTime(when) {
                if (!when) {
                    timeSpan.textContent = t("loading");
                    return;
                }
                const stamp = when.toLocaleTimeString(lang === "en" ? "en-HK" : "zh-HK", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: lang === "en"
                });
                timeSpan.textContent = t("updated") + " " + stamp + " · " + t("stopHint");
            }

            function toggleClass(active) {
                return "rounded-full px-2.5 py-1.5 min-h-11 sm:min-h-0 " +
                    (active ? "bg-white text-blue-700" : "text-white/85");
            }

            function setLang(next) {
                lang = next;
                try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignore */ }
                applyLang();
            }

            function escapeHtml(value) {
                return String(value ?? "")
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function minutesUntil(iso) {
                if (!iso) return null;
                const eta = new Date(iso);
                if (Number.isNaN(eta.getTime())) return null;
                return Math.round((eta.getTime() - Date.now()) / 60000);
            }

            function formatClock(iso) {
                const eta = new Date(iso);
                if (Number.isNaN(eta.getTime())) return "";
                return eta.toLocaleTimeString(lang === "en" ? "en-HK" : "zh-HK", {
                    hour: "2-digit",
                    minute: "2-digit",
                    hour12: lang === "en"
                });
            }

            function etaLabel(mins) {
                if (mins === null) return "—";
                if (mins <= 0) return t("due");
                return String(mins);
            }

            function etaUnit(mins) {
                if (mins === null) return "";
                if (mins <= 0) return t("now");
                return t("min");
            }

            function etaTone(mins) {
                if (mins === null) return "text-slate-400";
                if (mins <= 1) return "text-emerald-600";
                if (mins <= 8) return "text-blue-600";
                return "text-slate-900";
            }

            function setStatus(kind, extra) {
                let text = t(kind);
                if (kind === "live" && extra != null) {
                    text = t("live") + " · " + extra + " " + t("buses");
                }
                const tones = {
                    updating: "wait",
                    live: "live",
                    noDue: "wait",
                    apiDown: "bad",
                    failed: "bad"
                };
                const tone = tones[kind] || "live";
                const classes = {
                    live: "text-emerald-100",
                    wait: "text-amber-100",
                    bad: "text-red-100"
                };
                const mobileClasses = {
                    live: "text-emerald-700",
                    wait: "text-amber-700",
                    bad: "text-red-700"
                };
                liveStatus.textContent = text;
                liveStatus.className = "hidden rounded-full bg-white/15 px-2 py-1 text-[11px] font-semibold sm:inline " + (classes[tone] || classes.live);
                mobileStatus.textContent = text;
                mobileStatus.className = "mt-2 text-xs font-medium sm:hidden " + (mobileClasses[tone] || mobileClasses.live);
            }

            async function fetchJson(url, signal) {
                const response = await fetch(url, {
                    signal,
                    cache: "no-store",
                    headers: { Accept: "application/json" }
                });
                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }
                return response.json();
            }

            function destLine(dest) {
                if (lang === "en") return t("destPrefix") + " " + dest;
                return t("destPrefix") + dest;
            }
                const mins = minutesUntil(item.eta);
                const remark = lang === "en"
                    ? (item.rmk_en || item.rmk_tc || "")
                    : (item.rmk_tc || item.rmk_en || "");
                const dest = lang === "en"
                    ? (item.dest_en || item.dest_tc || "")
                    : (item.dest_tc || item.dest_en || "");
                const ring = isNext ? "ring-2 ring-blue-500 bg-blue-50/80" : "ring-1 ring-slate-200/80 bg-white";
                return (
                    '<article class="flex items-center gap-3 rounded-2xl p-3 shadow-sm sm:p-4 ' + ring + '">' +
                        '<div class="flex h-12 min-w-[3.75rem] shrink-0 items-center justify-center rounded-xl bg-blue-600 px-2 text-lg font-bold text-white">' +
                            escapeHtml(item.route) +
                        "</div>" +
                        '<div class="min-w-0 flex-1">' +
                            '<p class="truncate text-sm font-semibold text-slate-900">' +
                                escapeHtml(destLine(dest)) +
                            "</p>" +
                            '<p class="mt-0.5 text-[11px] text-slate-500">' +
                                escapeHtml(remark || (isNext ? t("next") : t("following"))) +
                            "</p>" +
                        "</div>" +
                        '<div class="shrink-0 text-right">' +
                            '<div class="flex items-baseline justify-end gap-1">' +
                                '<span class="text-[1.65rem] font-bold leading-none tabular-nums sm:text-3xl ' + etaTone(mins) + '">' +
                                    escapeHtml(etaLabel(mins)) +
                                "</span>" +
                                '<span class="text-[11px] font-semibold text-slate-400">' +
                                    escapeHtml(etaUnit(mins)) +
                                "</span>" +
                            "</div>" +
                            (item.eta
                                ? '<p class="mt-0.5 text-[10px] tabular-nums text-slate-400">' + escapeHtml(formatClock(item.eta)) + "</p>"
                                : "") +
                        "</div>" +
                    "</article>"
                );
            }

            function flattenArrivals(results) {
                const rows = [];
                results.forEach(function (r) {
                    (r.arrivals || []).forEach(function (item) {
                        if (!item || !item.eta) return;
                        rows.push(item);
                    });
                });
                rows.sort(function (a, b) {
                    return new Date(a.eta).getTime() - new Date(b.eta).getTime();
                });
                return rows;
            }

            function renderResults(results) {
                const failed = results.filter(function (r) { return r.error; });
                const arrivals = flattenArrivals(results);

                if (failed.length === ROUTES.length && !arrivals.length) {
                    container.innerHTML =
                        '<div class="col-span-full rounded-2xl bg-red-50 p-4 text-center text-sm text-red-700">' +
                        escapeHtml(t("fetchFail")) +
                        "</div>";
                    setStatus("apiDown");
                    return;
                }

                if (!arrivals.length) {
                    container.innerHTML =
                        '<div class="col-span-full rounded-2xl bg-amber-50 p-4 text-center text-sm text-amber-800">' +
                        escapeHtml(t("empty")) +
                        "</div>";
                    setStatus("noDue");
                    return;
                }

                container.innerHTML = arrivals.map(function (item, i) {
                    return arrivalCard(item, i === 0);
                }).join("");
                setStatus("live", arrivals.length);
            }

            async function fetchRouteEta(route, signal) {
                const url = API_BASE + "/eta/" + COMPANY + "/" + BOARD_STOP_ID + "/" + encodeURIComponent(route);
                try {
                    const payload = await fetchJson(url, signal);
                    const rows = Array.isArray(payload && payload.data) ? payload.data : [];
                    const arrivals = rows.filter(function (row) {
                        return row && row.dir === "O" && row.route === route;
                    });
                    return { route: route, arrivals: arrivals, error: null };
                } catch (err) {
                    return {
                        route: route,
                        arrivals: [],
                        error: err && err.name === "AbortError" ? null : (err && err.message) || "Failed"
                    };
                }
            }

            async function fetchBusData() {
                if (inflight) inflight.abort();
                inflight = new AbortController();
                const signal = inflight.signal;

                refreshBtn.disabled = true;
                refreshIcon.classList.add("animate-spin");
                setStatus("updating");

                try {
                    const results = await Promise.all(
                        ROUTES.map(function (route) {
                            return fetchRouteEta(route, signal);
                        })
                    );
                    if (signal.aborted) return;
                    lastResults = results;
                    lastUpdatedAt = new Date();
                    renderResults(results);
                    writeUpdatedTime(lastUpdatedAt);
                } catch (error) {
                    if (error && error.name === "AbortError") return;
                    lastResults = null;
                    setStatus("failed");
                    container.innerHTML =
                        '<div class="col-span-full rounded-2xl bg-red-50 p-4 text-center text-sm text-red-700">' +
                        escapeHtml(t("fetchFail")) +
                        "</div>";
                    timeSpan.textContent = t("lastAttempt") + " " + new Date().toLocaleTimeString(lang === "en" ? "en-HK" : "zh-HK", {
                        hour: "2-digit",
                        minute: "2-digit",
                        hour12: lang === "en"
                    });
                } finally {
                    refreshBtn.disabled = false;
                    refreshIcon.classList.remove("animate-spin");
                }
            }

            langZh.addEventListener("click", function () { setLang("zh-HK"); });
            langEn.addEventListener("click", function () { setLang("en"); });
            refreshBtn.addEventListener("click", fetchBusData);

            lang = detectLang();
            applyLang();
            fetchBusData();
            setInterval(fetchBusData, REFRESH_MS);
        })();
    </script>
</body>
</html>

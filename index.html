<html lang="zh-HK">
<head>

    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#B3EBF2">

    <meta property="og:title" content="九龍灣／鑽石山／黃大仙 → 國泰城 · 巴士到站時間">
    <meta property="og:description" content="城巴實時到站：九龍灣站、鑽石山站或黃大仙往國泰城／機場">

    <title>九龍灣／鑽石山／黃大仙 → 國泰城 · 巴士到站時間</title>
    <style>
        :root {
            --theme: #B3EBF2;
            --theme-deep: #0e7490;
            --theme-mid: #0891b2;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #cfe8ec;
            --bg: #eef8fa;
            --card: #fff;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            min-height: 100dvh;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang HK", "Noto Sans TC", sans-serif;
            background: var(--bg);
            color: var(--ink);
            padding-bottom: calc(var(--safe-bottom) + 1rem);
            -webkit-font-smoothing: antialiased;
        }
        a { color: var(--theme-deep); }
        button { font: inherit; cursor: pointer; }
        .shell {
            width: min(72rem, calc(100% - 1.5rem));
            margin-inline: auto;
        }
        @media (min-width: 640px) {
            .shell { width: min(72rem, calc(100% - 3rem)); }
        }
        header.top {
            position: sticky;
            top: 0;
            z-index: 20;
            background: var(--theme);
            color: var(--ink);
            padding-top: var(--safe-top);
            border-bottom: 1px solid #8fd4de;
        }
        .top-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 0;
        }
        .kicker {
            margin: 0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--theme-deep);
        }
        h1 { margin: 0.15rem 0 0; font-size: 1rem; line-height: 1.3; }
        .title-long { display: none; }
        .grow { min-width: 0; flex: 1; }
        .actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        #live-status {
            display: none;
            border-radius: 999px;
            background: rgb(14 116 144 / 0.12);
            padding: 0.25rem 0.65rem;
            font-size: 11px;
            font-weight: 700;
        }
        .lang {
            display: flex;
            overflow: hidden;
            border-radius: 999px;
            background: rgb(14 116 144 / 0.12);
            padding: 2px;
            font-size: 11px;
            font-weight: 800;
        }
        .lang button {
            border: 0;
            background: transparent;
            color: var(--theme-deep);
            border-radius: 999px;
            padding: 0.4rem 0.65rem;
            min-height: 44px;
        }
        .lang button.is-on {
            background: #fff;
            color: var(--ink);
        }
        #refresh-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border: 0;
            border-radius: 999px;
            background: #fff;
            color: var(--theme-deep);
            box-shadow: 0 1px 2px rgb(14 116 144 / 0.18);
        }
        #refresh-btn:disabled { opacity: 0.6; }
        #refresh-icon.spin { animation: spin 0.8s linear infinite; }
        #update-time {
            margin: 0;
            padding-bottom: 0.75rem;
            font-size: 11px;
            color: var(--theme-deep);
        }
        main { padding: 0.75rem 0 1.5rem; }
        .origin {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .origin button {
            min-height: 48px;
            border: 1px solid #cfe8ec;
            border-radius: 1rem;
            background: #fff;
            color: var(--ink);
            font-weight: 700;
            padding: 0.65rem 0.75rem;
        }
        .origin button.is-on {
            background: var(--theme);
            border-color: var(--theme-mid);
            box-shadow: inset 0 0 0 2px var(--theme-mid);
        }
        .origin button small {
            display: block;
            margin-top: 0.15rem;
            font-size: 10px;
            font-weight: 600;
            color: var(--muted);
            line-height: 1.25;
        }
        .hero {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }
        .card {
            background: var(--card);
            border-radius: 1rem;
            box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
            border: 1px solid rgb(207 232 236 / 0.9);
        }
        .journey-m {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0 0.75rem;
            padding: 0.75rem 1rem;
        }
        .rail {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 0.25rem;
        }
        .dot { width: 10px; height: 10px; border-radius: 999px; }
        .dot-a { background: var(--theme-deep); }
        .dot-b { background: var(--theme-mid); }
        .rail-line { width: 1px; flex: 1; margin: 0.25rem 0; background: var(--line); }
        .lbl {
            margin: 0;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #94a3b8;
        }
        .name { margin: 0.1rem 0 0; font-size: 0.9rem; font-weight: 700; }
        .hint { margin: 0.15rem 0 0; font-size: 12px; color: var(--muted); }
        .stack > div + div { margin-top: 0.75rem; }
        .journey-d { display: none; }
        .arrow { font-size: 1.5rem; font-weight: 300; color: #9fd0d8; padding: 0 0.5rem; }
        .pad { padding: 1rem 1.25rem; }
        .routes {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }
        .routes .card { text-align: center; padding: 0.65rem 0.5rem; }
        .routes .name { font-size: 1.05rem; }
        #mobile-status { margin: 0.5rem 0 0; font-size: 12px; font-weight: 600; color: #047857; }
        #eta-container {
            margin-top: 0.75rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }
        .eta-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: var(--card);
            border-radius: 1rem;
            padding: 0.75rem;
            border: 1px solid rgb(207 232 236 / 0.9);
            box-shadow: 0 1px 2px rgb(15 23 42 / 0.06);
        }
        .eta-card.is-next {
            background: #f2fbfd;
            border: 2px solid var(--theme-mid);
        }
        .badge {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 3.75rem;
            height: 3rem;
            padding: 0 0.5rem;
            border-radius: 0.75rem;
            background: var(--theme-deep);
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            flex-shrink: 0;
        }
        .eta-body { min-width: 0; flex: 1; }
        .eta-body p { margin: 0; }
        .dest { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sub { margin-top: 0.15rem; font-size: 11px; color: var(--muted); }
        .eta-time { text-align: right; flex-shrink: 0; }
        .mins {
            display: flex;
            align-items: baseline;
            justify-content: flex-end;
            gap: 0.25rem;
        }
        .mins b {
            font-size: 1.45rem;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }
        .mins span { font-size: 11px; font-weight: 700; color: #94a3b8; }
        .clock { margin: 0.15rem 0 0; font-size: 10px; color: #94a3b8; font-variant-numeric: tabular-nums; }
        .tone-due { color: #059669; }
        .tone-soon { color: var(--theme-deep); }
        .tone-later { color: var(--ink); }
        .tone-na { color: #94a3b8; }
        .banner {
            grid-column: 1 / -1;
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .banner.loading { background: #fff; color: #94a3b8; }
        .banner.error { background: #fef2f2; color: #b91c1c; }
        .banner.empty { background: #fffbeb; color: #92400e; }
        details.notes {
            margin-top: 1rem;
            background: #fff;
            border-radius: 1rem;
            padding: 1rem;
            border: 1px solid rgb(207 232 236 / 0.9);
            font-size: 0.9rem;
            color: #475569;
        }
        details.notes summary {
            min-height: 44px;
            cursor: pointer;
            font-weight: 700;
            color: var(--ink);
            list-style: none;
            display: flex;
            align-items: center;
        }
        details.notes summary::-webkit-details-marker { display: none; }
        details.notes ul { margin: 0.75rem 0 0; padding-left: 1.25rem; }
        details.notes li + li { margin-top: 0.5rem; }
        footer.site {
            margin-top: 1.25rem;
            padding-bottom: 1rem;
            text-align: center;
            font-size: 11px;
            line-height: 1.6;
            color: #94a3b8;
        }
        .status-wait { color: #b45309; }
        .status-bad { color: #b91c1c; }
        .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
        noscript { display: block; margin: 1rem; padding: 1rem; background: #fffbeb; color: #92400e; border-radius: 1rem; }
        @media (min-width: 640px) {
            .top-row { gap: 0.75rem; padding: 1rem 0; }
            h1 { font-size: 1.25rem; }
            .title-short { display: none; }
            .title-long { display: inline; }
            #live-status { display: inline; }
            .lang button { min-height: 0; }
            #refresh-btn { width: 48px; height: 48px; }
            #update-time { font-size: 12px; }
            main { padding: 1.5rem 0; }
            .journey-m { display: none; }
            .journey-d {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
            }
            .name { font-size: 1rem; }
            .routes { grid-template-columns: repeat(5, 1fr); }
            .routes .card { padding: 1rem 0.5rem; }
            .routes .name { font-size: 1.25rem; }
            #mobile-status { display: none; }
            #eta-container { margin-top: 1rem; }
            .eta-card { padding: 1rem; }
            .mins b { font-size: 1.75rem; }
        }
        @media (min-width: 768px) {
            #eta-container { grid-template-columns: 1fr 1fr; }
        }
        @media (min-width: 1024px) {
            .title-long { font-size: 1.5rem; }
            main { padding: 2rem 0; }
            .hero { grid-template-columns: 3fr 2fr; gap: 1rem; }
            #eta-container { grid-template-columns: 1fr 1fr 1fr; gap: 1rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

                <span id="live-status"></span>

            </div>
        </div>
        <p id="update-time" class="shell"></p>

    <main class="shell">

        <div class="origin" role="group" aria-label="上車地點">

        <div class="hero">
            <section class="card">
                <div class="journey-m">

                        <span class="dot dot-b"></span>
                    </div>
                    <div class="stack">
                        <div>

                            <p class="hint" id="board-hint-m">龍翔道 · 往機場／航天城方向</p>
                        </div>
                        <div>

                            <p class="name" data-i18n="alightStop">國泰城</p>
                            <p class="hint" data-i18n="alightHint">觀景路</p>
                        </div>
                    </div>
                </div>
                <div class="journey-d">
                    <div class="pad">
                        <p class="lbl" data-i18n="board">上車</p>
                        <p class="name" id="board-stop-d">鑽石山站</p>
                        <p class="hint" id="board-hint-d">龍翔道 · 往機場／航天城方向</p>
                    </div>
                    <div class="arrow" aria-hidden="true">→</div>
                    <div class="pad">
                        <p class="lbl" data-i18n="alight">下車</p>
                        <p class="name" data-i18n="alightStop">國泰城</p>
                        <p class="hint" data-i18n="alightHint">觀景路</p>

        </div>
        <p id="mobile-status"></p>
        <div id="eta-container" aria-live="polite">

        </div>
        <details class="notes">

        </footer>

                    boardHintWts: "Lung Cheung Road · Wong Tai Sin · towards Airport / SKYCITY",
                    alight: "Alight",
                    alightStop: "Cathay Pacific City",
                    alightHint: "Scenic Road",
                    routesAria: "Routes that serve this journey",
                    originAria: "Boarding stop",
                    refreshAria: "Refresh bus arrivals",
                    langGroup: "Language",
                    loading: "Fetching upcoming arrivals…",
                    updating: "Updating…",
                    live: "Live",
                    buses: "buses",
                    noDue: "No buses due",
                    apiDown: "API unavailable",
                    failed: "Failed",
                    updated: "Updated",
                    lastAttempt: "Last attempt",
                    fetchFail: "Could not reach the Citybus API. Check your network and tap refresh.",
                    empty: "No upcoming arrivals. Some routes only run at weekday peak hours.",
                    next: "Next bus",
                    following: "Following",
                    due: "Due",
                    now: "now",
                    destPrefix: "To",
                    corridorTitle: "Routes on this corridor",
                    noteRoutes: "Kowloon Bay Station: E22 (all day), E22X (peak), A22 (Cityflyer; some trips via Cathay City). Diamond Hill / Wong Tai Sin: E22, E22A, E22C, E22P, E22X.",
                    noteStops: "Kowloon Bay Station is 001500 (Kwun Tong Road). Diamond Hill Station is 001695. Wong Tai Sin boarding is Lung Cheung Road near Shatin Pass Road (001690), airport-bound. Alight at Cathay Pacific City, Scenic Road.",
                    noteSkip: "E22A / E22C / E22P skip Kowloon Bay Station. A22 / A29 skip Diamond Hill and Shatin Pass Road. E23 / E23A use the Tsz Wan Shan / Hung Hom corridor.",
                    footerBefore: "Data from ",
                    footerAfter: " Citybus Open API. Times are estimates only."
                }
            };

            var container = document.getElementById("eta-container");
            var timeSpan = document.getElementById("update-time");
            var liveStatus = document.getElementById("live-status");
            var mobileStatus = document.getElementById("mobile-status");
            var refreshBtn = document.getElementById("refresh-btn");
            var refreshIcon = document.getElementById("refresh-icon");
            var langZh = document.getElementById("lang-zh");
            var langEn = document.getElementById("lang-en");
            var langGroup = document.querySelector(".lang");
            var originGroup = document.querySelector(".origin");
            var originKb = document.getElementById("origin-kb");
            var originDh = document.getElementById("origin-dh");
            var originWts = document.getElementById("origin-wts");
            var routeChips = document.getElementById("route-chips");

            var inflight = null;
            var lastResults = null;
            var lastUpdatedAt = null;
            var lang = "zh-HK";
            var originKey = "kowloonBay";
            var refreshTimer = null;
            var tickTimer = null;

            function t(key) {
                var pack = I18N[lang] || I18N["zh-HK"];
                return pack[key] || key;
            }

            function currentOrigin() {
                return ORIGINS[originKey] || ORIGINS.kowloonBay;
            }

            function detectLang() {
                try {
                    var saved = localStorage.getItem(LANG_KEY);
                    if (saved === "en" || saved === "zh-HK") return saved;
                } catch (e) { /* private mode */ }
                return "zh-HK";
            }

            function detectOrigin() {
                try {
                    var saved = localStorage.getItem(ORIGIN_KEY);
                    if (saved && ORIGINS[saved]) return saved;
                } catch (e) { /* ignore */ }
                return "kowloonBay";
            }

            function pad2(n) {
                return n < 10 ? "0" + n : String(n);
            }

            function secondsUntil(iso) {
                if (!iso) return null;
                var eta = new Date(iso);
                if (isNaN(eta.getTime())) return null;
                return Math.round((eta.getTime() - Date.now()) / 1000);
            }

            function countdownParts(iso) {
                var sec = secondsUntil(iso);
                if (sec === null) return { label: "—", unit: "", tone: "tone-na", sec: null };
                if (sec <= 0) return { label: t("due"), unit: t("now"), tone: "tone-due", sec: sec };
                var m = Math.floor(sec / 60);
                var s = sec % 60;
                return {
                    label: m + ":" + pad2(s),
                    unit: "",
                    tone: sec <= 60 ? "tone-due" : (sec <= 480 ? "tone-soon" : "tone-later"),
                    sec: sec
                };
            }

            function formatClock(iso) {
                var eta = iso instanceof Date ? iso : new Date(iso);
                if (isNaN(eta.getTime())) return "";
                return eta.toLocaleTimeString(lang === "en" ? "en-HK" : "zh-HK", {
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: lang === "en"
                });
            }

            function applyOriginUi() {
                var origin = currentOrigin();
                var suffix = origin.suffix;
                originKb.className = originKey === "kowloonBay" ? "is-on" : "";
                originDh.className = originKey === "diamondHill" ? "is-on" : "";
                originWts.className = originKey === "wongTaiSin" ? "is-on" : "";
                originKb.setAttribute("aria-pressed", originKey === "kowloonBay" ? "true" : "false");
                originDh.setAttribute("aria-pressed", originKey === "diamondHill" ? "true" : "false");
                originWts.setAttribute("aria-pressed", originKey === "wongTaiSin" ? "true" : "false");
                document.getElementById("title-short").textContent = t("titleShort" + suffix);
                document.getElementById("title-long").textContent = t("titleLong" + suffix);
                document.title = t("documentTitle" + suffix);
                document.getElementById("board-stop-m").textContent = t("boardStop" + suffix);
                document.getElementById("board-hint-m").textContent = t("boardHint" + suffix);
                document.getElementById("board-stop-d").textContent = t("boardStop" + suffix);
                document.getElementById("board-hint-d").textContent = t("boardHint" + suffix);
                writeUpdatedTime(lastUpdatedAt);
                renderRouteChips();
            }

            function renderRouteChips() {
                var routes = currentOrigin().routes;
                routeChips.innerHTML = routes.map(function (route) {
                    return '<div class="card"><p class="name">' + escapeHtml(route) + "</p></div>";
                }).join("");
            }

            function applyLang() {
                var pack = I18N[lang];
                document.documentElement.lang = pack.htmlLang;
                document.querySelectorAll("[data-i18n]").forEach(function (el) {
                    el.textContent = t(el.getAttribute("data-i18n"));
                });
                document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
                    el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria")));
                });
                if (langGroup) langGroup.setAttribute("aria-label", t("langGroup"));
                if (originGroup) originGroup.setAttribute("aria-label", t("originAria"));
                langZh.className = lang === "zh-HK" ? "is-on" : "";
                langEn.className = lang === "en" ? "is-on" : "";
                langZh.setAttribute("aria-pressed", lang === "zh-HK" ? "true" : "false");
                langEn.setAttribute("aria-pressed", lang === "en" ? "true" : "false");
                applyOriginUi();
                if (lastResults) renderResults(lastResults);
            }

            function writeUpdatedTime(when) {
                if (!when) {
                    timeSpan.textContent = t("loading");
                    return;
                }
                timeSpan.textContent = t("updated") + " " + formatClock(when.toISOString());
            }

            function setLang(next) {
                lang = next;
                try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* ignore */ }
                applyLang();
            }

            function setOrigin(next) {
                if (!ORIGINS[next] || next === originKey) return;
                originKey = next;
                try { localStorage.setItem(ORIGIN_KEY, originKey); } catch (e) { /* ignore */ }
                lastResults = null;
                applyOriginUi();
                fetchBusData();
            }

            function escapeHtml(value) {
                return String(value == null ? "" : value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }

            function destLine(dest) {
                return lang === "en" ? t("destPrefix") + " " + dest : t("destPrefix") + dest;
            }

            function setStatus(kind, extra) {
                var text = t(kind);
                if (kind === "live" && extra != null) text = t("live") + " · " + extra + " " + t("buses");
                var tone = { updating: "wait", live: "live", noDue: "wait", apiDown: "bad", failed: "bad" }[kind] || "live";
                liveStatus.textContent = text;
                liveStatus.className = tone === "wait" ? "status-wait" : tone === "bad" ? "status-bad" : "";
                mobileStatus.textContent = text;
                mobileStatus.className = tone === "wait" ? "status-wait" : tone === "bad" ? "status-bad" : "";
            }

            function fetchJson(url, signal) {
                var timeout = new AbortController();
                var timerId = setTimeout(function () { timeout.abort(); }, FETCH_MS);
                var combined = (typeof AbortSignal !== "undefined" && AbortSignal.any)
                    ? AbortSignal.any([signal, timeout.signal])
                    : signal;
                return fetch(url, {
                    signal: combined,
                    cache: "no-store",
                    credentials: "omit",
                    mode: "cors",
                    referrerPolicy: "no-referrer",
                    headers: { Accept: "application/json" }
                }).then(function (response) {
                    if (!response.ok) throw new Error("HTTP " + response.status);
                    return response.json();
                }).finally(function () {
                    clearTimeout(timerId);
                });
            }

            function arrivalCard(item, isNext) {
                var parts = countdownParts(item.eta);
                var remark = lang === "en" ? (item.rmk_en || item.rmk_tc || "") : (item.rmk_tc || item.rmk_en || "");
                var dest = lang === "en" ? (item.dest_en || item.dest_tc || "") : (item.dest_tc || item.dest_en || "");
                return (
                    '<article class="eta-card' + (isNext ? " is-next" : "") + '" data-eta="' + escapeHtml(item.eta) + '">' +
                        '<div class="badge">' + escapeHtml(item.route) + "</div>" +
                        '<div class="eta-body">' +
                            '<p class="dest">' + escapeHtml(destLine(dest)) + "</p>" +
                            '<p class="sub">' + escapeHtml(remark || (isNext ? t("next") : t("following"))) + "</p>" +
                        "</div>" +
                        '<div class="eta-time">' +
                            '<div class="mins">' +
                                '<b class="' + parts.tone + '">' + escapeHtml(parts.label) + "</b>" +
                                (parts.unit ? "<span>" + escapeHtml(parts.unit) + "</span>" : "") +
                            "</div>" +
                            (item.eta ? '<p class="clock">' + escapeHtml(formatClock(item.eta)) + "</p>" : "") +
                        "</div>" +
                    "</article>"
                );
            }

            function tickCountdowns() {
                var cards = container.querySelectorAll(".eta-card[data-eta]");
                cards.forEach(function (card) {
                    var parts = countdownParts(card.getAttribute("data-eta"));
                    var b = card.querySelector(".mins b");
                    var span = card.querySelector(".mins span");
                    if (b) {
                        b.textContent = parts.label;
                        b.className = parts.tone;
                    }
                    if (span) {
                        if (parts.unit) {
                            span.textContent = parts.unit;
                            span.hidden = false;
                        } else {
                            span.textContent = "";
                            span.hidden = true;
                        }
                    }
                });
            }

            function flattenArrivals(results) {
                var rows = [];
                results.forEach(function (r) {
                    (r.arrivals || []).forEach(function (item) {
                        if (item && item.eta) rows.push(item);
                    });
                });
                rows.sort(function (a, b) {
                    return new Date(a.eta).getTime() - new Date(b.eta).getTime();
                });
                return rows;
            }

            function renderResults(results) {
                var routes = currentOrigin().routes;
                var failed = results.filter(function (r) { return r.error; });
                var arrivals = flattenArrivals(results);
                if (failed.length === routes.length && !arrivals.length) {
                    container.innerHTML = '<div class="banner error">' + escapeHtml(t("fetchFail")) + "</div>";
                    setStatus("apiDown");
                    return;
                }
                if (!arrivals.length) {
                    container.innerHTML = '<div class="banner empty">' + escapeHtml(t("empty")) + "</div>";
                    setStatus("noDue");
                    return;
                }
                container.innerHTML = arrivals.map(function (item, i) {
                    return arrivalCard(item, i === 0);
                }).join("");
                setStatus("live", arrivals.length);
            }

            function fetchRouteEta(route, stopId, signal) {
                var url = API_BASE + "/eta/" + COMPANY + "/" + stopId + "/" + encodeURIComponent(route);
                return fetchJson(url, signal).then(function (payload) {
                    var rows = payload && Array.isArray(payload.data) ? payload.data : [];
                    return {
                        route: route,
                        arrivals: rows.filter(function (row) {
                            return row && row.dir === "O" && row.route === route;
                        }),
                        error: null
                    };
                }).catch(function (err) {
                    if (err && err.name === "AbortError" && inflight && inflight.signal.aborted) {
                        return { route: route, arrivals: [], error: null };
                    }
                    return { route: route, arrivals: [], error: (err && err.message) || "Failed" };
                });
            }

            function fetchBusData() {
                if (typeof document !== "undefined" && document.hidden) return;
                if (inflight) inflight.abort();
                inflight = new AbortController();
                var signal = inflight.signal;
                var origin = currentOrigin();
                refreshBtn.disabled = true;
                refreshIcon.classList.add("spin");
                setStatus("updating");
                Promise.all(origin.routes.map(function (route) {
                    return fetchRouteEta(route, origin.stopId, signal);
                })).then(function (results) {
                    if (signal.aborted) return;
                    lastResults = results;
                    lastUpdatedAt = new Date();
                    renderResults(results);
                    writeUpdatedTime(lastUpdatedAt);
                }).catch(function (error) {
                    if (error && error.name === "AbortError") return;
                    lastResults = null;
                    setStatus("failed");
                    container.innerHTML = '<div class="banner error">' + escapeHtml(t("fetchFail")) + "</div>";
                    timeSpan.textContent = t("lastAttempt") + " " + formatClock(new Date());
                }).finally(function () {
                    refreshBtn.disabled = false;
                    refreshIcon.classList.remove("spin");
                });
            }

            langZh.addEventListener("click", function () { setLang("zh-HK"); });
            langEn.addEventListener("click", function () { setLang("en"); });
            originKb.addEventListener("click", function () { setOrigin("kowloonBay"); });
            originDh.addEventListener("click", function () { setOrigin("diamondHill"); });
            originWts.addEventListener("click", function () { setOrigin("wongTaiSin"); });
            refreshBtn.addEventListener("click", fetchBusData);
            document.addEventListener("visibilitychange", function () {
                if (!document.hidden) fetchBusData();
            });

            lang = detectLang();
            originKey = detectOrigin();
            applyLang();
            fetchBusData();
            refreshTimer = setInterval(fetchBusData, REFRESH_MS);
            tickTimer = setInterval(tickCountdowns, 1000);
            window.addEventListener("pagehide", function () {
                if (inflight) inflight.abort();
                if (refreshTimer) clearInterval(refreshTimer);
                if (tickTimer) clearInterval(tickTimer);
            });
        })();
    </script>
</body>
</html>
